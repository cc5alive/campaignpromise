name: Fetch pilot roll-call votes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/fetch_votes.py"
      - ".github/workflows/fetch-votes.yml"

permissions:
  contents: write

concurrency:
  group: fetch-votes
  cancel-in-progress: false

jobs:
  votes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - run: python pipeline/fetch_votes.py
      - name: Commit votes
        run: |
          git config user.name "campaignpromise-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add votes
          git commit -m "Fetch roll-call votes on pilot bills" || echo "Nothing new to commit"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
