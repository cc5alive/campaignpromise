name: Archive 2024 campaign pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/archive_campaign_pages.py"
      - "pipeline/pilot_members.json"
      - ".github/workflows/archive-campaign-pages.yml"

permissions:
  contents: write

concurrency:
  group: archive-campaign-pages
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        member: [moreno, curtis, warren, gallego, massie, lawler, salazar, aoc, torres, mgp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - run: python pipeline/archive_campaign_pages.py ${{ matrix.member }}
      - name: Commit archive
        run: |
          git config user.name "campaignpromise-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git commit -m "Archive 2024 campaign pages: ${{ matrix.member }}" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase origin main && git push origin HEAD:main && break; sleep $((RANDOM % 10 + 5)); done
